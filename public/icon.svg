<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep rich walnut wood -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A2818"/>
      <stop offset="50%" stop-color="#2E170C"/>
      <stop offset="100%" stop-color="#1A0D07"/>
    </linearGradient>

    <!-- Golden Rim Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="30%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- Metal Steel Gradient for tools -->
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Warm Timber Gradient for hammer handle -->
    <linearGradient id="woodHandle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="60%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Squircle / Rounded Container -->
  <rect x="16" y="16" width="480" height="480" rx="120" ry="120" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Rim -->
  <rect x="16" y="16" width="480" height="480" rx="120" ry="120" fill="none" stroke="url(#goldGrad)" stroke-width="20"/>
  <!-- Inner subtle accent ring -->
  <rect x="36" y="36" width="440" height="440" rx="104" ry="104" fill="none" stroke="#F59E0B" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Center Woodworking Tools Group (Hammer & Try-Square) -->
  <g filter="url(#shadow)" transform="translate(0, 0)">
    
    <!-- 1. CARPENTER TRY-SQUARE (ESQUADRO) - Rotated in background -->
    <g transform="translate(256, 256) rotate(-28) translate(-256, -256)">
      <!-- L-Shape Body -->
      <!-- Vertical blade -->
      <path d="M 175 110 L 225 110 L 225 350 L 375 350 L 375 400 L 175 400 Z" fill="url(#steelGrad)" stroke="#64748B" stroke-width="4"/>
      <!-- Inner cutout of L-blade to make it an authentic try-square -->
      <path d="M 225 160 L 225 350 L 175 350" fill="none"/>
      <!-- Measurement tick marks on square ruler -->
      <line x1="225" y1="140" x2="205" y2="140" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
      <line x1="225" y1="170" x2="212" y2="170" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
      <line x1="225" y1="200" x2="205" y2="200" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
      <line x1="225" y1="230" x2="212" y2="230" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
      <line x1="225" y1="260" x2="205" y2="260" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
      <line x1="225" y1="290" x2="212" y2="290" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
      <line x1="225" y1="320" x2="205" y2="320" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
      
      <!-- Horizontal branch ticks -->
      <line x1="260" y1="350" x2="260" y2="370" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
      <line x1="295" y1="350" x2="295" y2="363" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
      <line x1="330" y1="350" x2="330" y2="370" stroke="#475569" stroke-width="5" stroke-linecap="round"/>

      <!-- Wooden Base of Square (Cabo de madeira do esquadro) -->
      <rect x="155" y="335" width="70" height="75" rx="8" fill="url(#woodHandle)" stroke="#78350F" stroke-width="4"/>
      <!-- Brass rivets on wooden base -->
      <circle cx="178" cy="372" r="5" fill="#FDE68A"/>
      <circle cx="202" cy="372" r="5" fill="#FDE68A"/>
    </g>

    <!-- 2. CARPENTER CLAW HAMMER (MARTELO DE MARCENEIRO) - Foreground crossed -->
    <g transform="translate(256, 256) rotate(32) translate(-256, -256)">
      <!-- Hammer Handle -->
      <path d="M 242 175 L 270 175 L 265 415 A 12 12 0 0 1 247 415 Z" fill="url(#woodHandle)" stroke="#451A03" stroke-width="4"/>
      <!-- Grip bands on handle -->
      <rect x="242" y="340" width="28" height="60" rx="6" fill="#1C1917" opacity="0.85"/>
      <line x1="243" y1="355" x2="269" y2="355" stroke="#44403C" stroke-width="3"/>
      <line x1="243" y1="370" x2="269" y2="370" stroke="#44403C" stroke-width="3"/>
      <line x1="243" y1="385" x2="269" y2="385" stroke="#44403C" stroke-width="3"/>

      <!-- Hammer Head (Metal) -->
      <!-- Center collar -->
      <rect x="236" y="145" width="40" height="40" rx="4" fill="url(#steelGrad)" stroke="#334155" stroke-width="4"/>
      <!-- Striking Face (Left/Striker) -->
      <path d="M 236 150 L 175 152 L 170 142 L 155 142 L 155 188 L 170 188 L 175 178 L 236 180 Z" fill="url(#steelGrad)" stroke="#334155" stroke-width="4"/>
      <!-- Curved Claw (Right/Extrator de pregos) -->
      <path d="M 276 150 C 315 150 345 168 360 215 C 348 200 325 188 276 175 Z" fill="url(#steelGrad)" stroke="#334155" stroke-width="4"/>
    </g>

  </g>

  <!-- Top Crown / Star for Quality Mark -->
  <path d="M 256 50 L 264 68 L 284 70 L 269 83 L 273 102 L 256 92 L 239 102 L 243 83 L 228 70 L 248 68 Z" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
</svg>